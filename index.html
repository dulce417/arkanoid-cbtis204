<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arkanoid</title>

<style>
body{
    background:#0b1020;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
}

canvas{
    background:black;
    border:3px solid white;
}
</style>
</head>
<body>

<h1>ARKANOID</h1>
<p>Puntos: <span id="score">0</span></p>

<canvas id="gameCanvas" width="800" height="500"></canvas>

<script>

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

let score = 0;

const ball = {
    x: 400,
    y: 300,
    radius: 10,
    dx: 4,
    dy: -4
};

const paddle = {
    x: 340,
    y: 470,
    width: 120,
    height: 15,
    speed: 8
};

let rightPressed = false;
let leftPressed = false;

const bricks = [];

for(let r=0;r<5;r++){
    bricks[r]=[];

    for(let c=0;c<8;c++){
        bricks[r][c]={
            x:60+c*90,
            y:40+r*35,
            status:true
        };
    }
}

document.addEventListener("keydown",function(e){
    if(e.key==="ArrowRight"){
        rightPressed=true;
    }

    if(e.key==="ArrowLeft"){
        leftPressed=true;
    }
});

document.addEventListener("keyup",function(e){
    if(e.key==="ArrowRight"){
        rightPressed=false;
    }

    if(e.key==="ArrowLeft"){
        leftPressed=false;
    }
});

function drawBall(){
    ctx.beginPath();
    ctx.arc(ball.x,ball.y,ball.radius,0,Math.PI*2);
    ctx.fillStyle="white";
    ctx.fill();
    ctx.closePath();
}

function drawPaddle(){
    ctx.fillStyle="lime";
    ctx.fillRect(
        paddle.x,
        paddle.y,
        paddle.width,
        paddle.height
    );
}

function drawBricks(){

    for(let r=0;r<5;r++){

        for(let c=0;c<8;c++){

            if(bricks[r][c].status){

                ctx.fillStyle="orange";

                ctx.fillRect(
                    bricks[r][c].x,
                    bricks[r][c].y,
                    80,
                    20
                );
            }
        }
    }
}

function collisionDetection(){

    for(let r=0;r<5;r++){

        for(let c=0;c<8;c++){

            let b=bricks[r][c];

            if(
                b.status &&
                ball.x>b.x &&
                ball.x<b.x+80 &&
                ball.y>b.y &&
                ball.y<b.y+20
            ){

                ball.dy=-ball.dy;
                b.status=false;

                score++;

                document.getElementById("score").textContent=score;
            }
        }
    }
}

function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    drawBricks();
    drawBall();
    drawPaddle();

    collisionDetection();

    if(ball.x+ball.dx>canvas.width-ball.radius ||
       ball.x+ball.dx<ball.radius){
        ball.dx=-ball.dx;
    }

    if(ball.y+ball.dy<ball.radius){
        ball.dy=-ball.dy;
    }

    if(ball.y+ball.dy>paddle.y-ball.radius){

        if(
            ball.x>paddle.x &&
            ball.x<paddle.x+paddle.width
        ){
            ball.dy=-ball.dy;
        }
    }

    if(ball.y>canvas.height){

        alert("GAME OVER");
        location.reload();
    }

    if(rightPressed &&
       paddle.x<canvas.width-paddle.width){
        paddle.x+=paddle.speed;
    }

    if(leftPressed &&
       paddle.x>0){
        paddle.x-=paddle.speed;
    }

    ball.x+=ball.dx;
    ball.y+=ball.dy;

    requestAnimationFrame(draw);
}

draw();

</script>

</body>
</html>
