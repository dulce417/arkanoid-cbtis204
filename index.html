<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arkanoid</title>

<style>
body{
    background:#0b1020;
    color:white;
    text-align:center;
    font-family:Arial,sans-serif;
}

canvas{
    background:black;
    border:3px solid white;
}
</style>
</head>
<body>

<h1>ARKANOID</h1>
<p>Puntos: <span id="score">0</span></p>

<canvas id="game" width="800" height="500"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let score = 0;

let ballX = 400;
let ballY = 250;
let ballDX = 4;
let ballDY = -4;
const ballRadius = 10;

let paddleX = 340;
const paddleWidth = 120;
const paddleHeight = 15;
const paddleY = 470;

let right = false;
let left = false;

document.addEventListener("keydown", e=>{
    if(e.key==="ArrowRight") right=true;
    if(e.key==="ArrowLeft") left=true;
});

document.addEventListener("keyup", e=>{
    if(e.key==="ArrowRight") right=false;
    if(e.key==="ArrowLeft") left=false;
});

const bricks = [];

for(let r=0;r<5;r++){
    for(let c=0;c<8;c++){
        bricks.push({
            x:60 + c*85,
            y:40 + r*35,
            width:70,
            height:20,
            visible:true
        });
    }
}

function drawBricks(){

    bricks.forEach(brick=>{

        if(brick.visible){

            ctx.fillStyle="orange";

            ctx.fillRect(
                brick.x,
                brick.y,
                brick.width,
                brick.height
            );
        }
    });
}

function collisionBricks(){

    bricks.forEach(brick=>{

        if(
            brick.visible &&
            ballX > brick.x &&
            ballX < brick.x + brick.width &&
            ballY > brick.y &&
            ballY < brick.y + brick.height
        ){

            brick.visible = false;

            ballDY = -ballDY;

            score++;

            document.getElementById("score").textContent = score;
        }
    });
}

function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    drawBricks();

    ctx.beginPath();
    ctx.arc(ballX,ballY,ballRadius,0,Math.PI*2);
    ctx.fillStyle="white";
    ctx.fill();

    ctx.fillStyle="lime";
    ctx.fillRect(
        paddleX,
        paddleY,
        paddleWidth,
        paddleHeight
    );

    collisionBricks();

    ballX += ballDX;
    ballY += ballDY;

    if(ballX > canvas.width-ballRadius ||
       ballX < ballRadius){
        ballDX = -ballDX;
    }

    if(ballY < ballRadius){
        ballDY = -ballDY;
    }

    if(
        ballY + ballRadius >= paddleY &&
        ballY + ballRadius <= paddleY + paddleHeight &&
        ballX >= paddleX &&
        ballX <= paddleX + paddleWidth
    ){
        ballDY = -Math.abs(ballDY);
    }

    if(ballY > canvas.height){
        ballX = 400;
        ballY = 250;
        ballDX = 4;
        ballDY = -4;
    }

    if(right && paddleX < canvas.width-paddleWidth){
        paddleX += 7;
    }

    if(left && paddleX > 0){
        paddleX -= 7;
    }

    requestAnimationFrame(draw);
}

draw();

</script>

</body>
</html>
