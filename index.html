<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Arkanoid Simple</title>
<style>
body{
    background:#111;
    text-align:center;
    color:white;
    font-family:Arial;
}
canvas{
    background:black;
    border:2px solid white;
}
</style>
</head>
<body>

<h1>Arkanoid</h1>

<canvas id="game" width="800" height="500"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let ballX = 400;
let ballY = 250;
let ballDX = 4;
let ballDY = -4;
const ballRadius = 10;

let paddleX = 340;
const paddleWidth = 120;
const paddleHeight = 15;

let right = false;
let left = false;

document.addEventListener("keydown", e=>{
    if(e.key==="ArrowRight") right=true;
    if(e.key==="ArrowLeft") left=true;
});

document.addEventListener("keyup", e=>{
    if(e.key==="ArrowRight") right=false;
    if(e.key==="ArrowLeft") left=false;
});

function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.beginPath();
    ctx.arc(ballX,ballY,ballRadius,0,Math.PI*2);
    ctx.fillStyle="white";
    ctx.fill();

    ctx.fillStyle="lime";
    ctx.fillRect(
        paddleX,
        470,
        paddleWidth,
        paddleHeight
    );

    ballX += ballDX;
    ballY += ballDY;

    if(ballX > canvas.width-ballRadius || ballX < ballRadius){
        ballDX = -ballDX;
    }

    if(ballY < ballRadius){
        ballDY = -ballDY;
    }

    if(
        ballY + ballRadius >= 470 &&
        ballX >= paddleX &&
        ballX <= paddleX + paddleWidth
    ){
        ballDY = -Math.abs(ballDY);
    }

    if(ballY > canvas.height){
        ballX = 400;
        ballY = 250;
        ballDX = 4;
        ballDY = -4;
    }

    if(right && paddleX < canvas.width-paddleWidth){
        paddleX += 7;
    }

    if(left && paddleX > 0){
        paddleX -= 7;
    }

    requestAnimationFrame(draw);
}
const bricks = [];

for(let r=0;r<5;r++){
    for(let c=0;c<8;c++){
        bricks.push({
            x:60 + c*85,
            y:40 + r*30,
            width:70,
            height:20
        });
    }
}

function drawBricks(){
    bricks.forEach(brick=>{
        ctx.fillStyle = "orange";
        ctx.fillRect(
            brick.x,
            brick.y,
            brick.width,
            brick.height
        );
    });
}
draw();

</script>

</body>
</html>
